<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro - Creator OS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        midnight: {
                            50:'#f0f3ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',
                            400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',
                            800:'#3730a3',900:'#312e81',950:'#1e1b4b'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/videos.css">
    <link rel="stylesheet" href="css/brands.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/tasks.css">
</head>
<body class="font-sans antialiased h-screen flex overflow-hidden selection:bg-midnight-500 selection:text-white">

    <div id="error-boundary" class="hidden fixed inset-0 bg-red-50 z-[100] flex flex-col items-center justify-center p-8 text-center">
        <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500 mb-4"></i>
        <h1 class="text-2xl font-bold text-red-900 mb-2">Something went wrong</h1>
        <p class="text-red-700 mb-4 max-w-md" id="error-message">A critical error occurred while loading the application.</p>
        <button onclick="window.location.reload()" class="px-6 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 app-transition">Reload Page</button>
    </div>

    <div id="mobile-overlay" class="mobile-overlay hidden" onclick="closeMobileNav()"></div>

    <aside id="sidebar" class="app-sidebar glass-panel border-r border-slate-200 flex flex-col h-full z-40 relative shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-5 flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-midnight-500 to-indigo-700 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-midnight-500/30">V</div>
                <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-midnight-900 to-indigo-700 tracking-tight">Vyro</h1>
            </div>
            <button class="mobile-only-icon" onclick="closeMobileNav()" aria-label="Close menu"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <nav class="flex-1 px-4 py-3 space-y-1 overflow-y-auto" id="nav-menu"></nav>

        <div class="p-4 border-t border-slate-200">
            <button onclick="navigate('settings'); closeMobileNav()" class="w-full flex items-center gap-3 px-3 py-3 text-sm font-medium text-slate-600 hover:text-midnight-600 hover:bg-midnight-50 rounded-xl app-transition">
                <img src="https://ui-avatars.com/api/?name=Creator&background=e0e7ff&color=3730a3" alt="Profile" class="w-8 h-8 rounded-full border border-slate-200">
                <div class="text-left flex-1 min-w-0">
                    <div class="text-slate-900 font-semibold text-sm truncate">Creator Workspace</div>
                    <div class="text-xs text-slate-500">Free Plan</div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col h-full min-w-0 relative overflow-hidden bg-slate-50/50">
        <header class="h-16 min-h-16 glass-panel border-b border-slate-200 flex items-center justify-between px-5 sm:px-8 z-30 relative">
            <div class="flex items-center gap-3 min-w-0">
                <button id="mobile-menu-button" class="mobile-menu-button" onclick="openMobileNav()" aria-label="Open navigation">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <h2 class="text-lg font-semibold text-slate-800 truncate" id="current-view-title">Dashboard</h2>
            </div>
            <div class="flex items-center gap-2 sm:gap-4">
                <button onclick="showNotifications()" class="relative w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-midnight-600 hover:shadow-md app-transition" aria-label="Notifications">
                    <i class="fa-solid fa-bell"></i>
                    <span id="notification-dot" class="notification-dot"></span>
                </button>
                <button onclick="openNewVideoModal()" class="hidden sm:flex px-4 py-2 bg-gradient-to-r from-midnight-600 to-indigo-600 text-white rounded-lg shadow-md shadow-midnight-500/20 text-sm font-medium hover:-translate-y-0.5 app-transition items-center gap-2">
                    <i class="fa-solid fa-plus"></i> New Video
                </button>
            </div>
        </header>

        <div id="view-container" class="flex-1 overflow-auto p-4 sm:p-6 lg:p-8 app-transition"></div>
    </main>

    <div id="global-modal" class="hidden fixed inset-0 z-[90] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div id="modal-content" class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto transform scale-95 opacity-0 app-transition"></div>
    </div>

    <script src="js/firebase.js" defer></script>
    <script src="js/dashboard.js" defer></script>
    <script src="js/videos.js" defer></script>
    <script src="js/tasks.js" defer></script>
    <script src="js/brands.js" defer></script>
    <script src="js/calendar.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
