<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro - Creator OS</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        midnight: {
                            50:'#f0f3ff',100:'#e0e7ff',200:'#c7d2fe',300:'#a5b4fc',
                            400:'#818cf8',500:'#6366f1',600:'#4f46e5',700:'#4338ca',
                            800:'#3730a3',900:'#312e81',950:'#1e1b4b'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script>try{if(localStorage.getItem("vyro-theme")==="dark")document.documentElement.classList.add("theme-dark-preload")}catch(e){}</script>
    <link rel="stylesheet" href="css/global.css?v=5">
    <link rel="stylesheet" href="css/components.css?v=4">
    <link rel="stylesheet" href="css/dashboard.css?v=6">
    <link rel="stylesheet" href="css/videos.css?v=4">
    <link rel="stylesheet" href="css/brands.css?v=4">
    <link rel="stylesheet" href="css/calendar.css?v=4">
    <link rel="stylesheet" href="css/settings.css?v=4">
    <link rel="stylesheet" href="css/tasks.css?v=4">
</head>
<body class="font-sans antialiased selection:bg-midnight-500 selection:text-white">

    <div id="error-boundary" class="hidden fixed inset-0 bg-red-50 z-[100] flex flex-col items-center justify-center p-8 text-center">
        <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500 mb-4"></i>
        <h1 class="text-2xl font-bold text-red-900 mb-2">Something went wrong</h1>
        <p class="text-red-700 mb-4 max-w-md" id="error-message">A critical error occurred while loading the application.</p>
        <button onclick="window.location.reload()" class="px-6 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 app-transition">Reload Page</button>
    </div>

    <div class="app-shell">
        <header class="topbar">
            <button class="brand" onclick="navigate('dashboard',false)" aria-label="Home"><span class="brand-mark">V</span><span>Vyro</span></button>
            <div class="topbar-center"><span id="current-view-title">Dashboard</span></div>
            <div class="topbar-actions">
                <button onclick="showNotifications()" class="top-icon" aria-label="Notifications"><i class="fa-regular fa-bell"></i><span id="notification-dot" class="notification-dot"></span></button>
                <button onclick="toggleGlobalTheme()" class="top-icon" aria-label="Toggle theme"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button onclick="openNewVideoModal()" class="top-new"><i class="fa-solid fa-plus"></i><span>New video</span></button>
            </div>
        </header>
        <main id="view-container" class="app-content"></main>
    </div>

    <div id="global-modal" class="hidden fixed inset-0 z-[90] flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div id="modal-content" class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto transform scale-95 opacity-0 app-transition"></div>
    </div>

    <script src="js/firebase.js?v=3" defer></script>
    <script src="js/dashboard.js?v=3" defer></script>
    <script src="js/videos.js?v=3" defer></script>
    <script src="js/tasks.js?v=3" defer></script>
    <script src="js/brands.js?v=3" defer></script>
    <script src="js/calendar.js?v=3" defer></script>
    <script src="js/settings.js?v=3" defer></script>
    <script src="js/navigation.js?v=3" defer></script>
    <script src="js/app.js?v=3" defer></script>
</body>
</html>
