<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vyro - Creator OS</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/videos.css">
    <link rel="stylesheet" href="css/brands.css">
    <link rel="stylesheet" href="css/calendar.css">
    <link rel="stylesheet" href="css/settings.css">
    <link rel="stylesheet" href="css/tasks.css">
</head>
<body class="font-sans antialiased h-screen flex overflow-hidden selection:bg-midnight-500 selection:text-white">

    <!-- Error Boundary -->
    <div id="error-boundary" class="hidden fixed inset-0 bg-red-50 z-50 flex flex-col items-center justify-center p-8 text-center">
        <i class="fa-solid fa-triangle-exclamation text-6xl text-red-500 mb-4"></i>
        <h1 class="text-2xl font-bold text-red-900 mb-2">Something went wrong</h1>
        <p class="text-red-700 mb-4 max-w-md" id="error-message">A critical error occurred while loading the application.</p>
        <button onclick="window.location.reload()" class="px-6 py-2 bg-red-600 text-white rounded-lg shadow hover:bg-red-700 app-transition">Reload Page</button>
    </div>

    <!-- Sidebar Navigation -->
    <aside class="w-64 glass-panel border-r border-slate-200 flex flex-col h-full z-10 relative shadow-[4px_0_24px_rgba(0,0,0,0.02)]">
        <div class="p-6 flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-midnight-500 to-indigo-700 flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-midnight-500/30">V</div>
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-midnight-900 to-indigo-700 tracking-tight">Vyro</h1>
        </div>
        <nav class="flex-1 px-4 py-4 space-y-1" id="nav-menu"></nav>
        <div class="p-4 border-t border-slate-200">
            <button class="w-full flex items-center gap-3 px-4 py-3 text-sm font-medium text-slate-600 hover:text-midnight-600 hover:bg-midnight-50 rounded-xl app-transition">
                <img src="https://ui-avatars.com/api/?name=Creator&background=e0e7ff&color=3730a3" alt="Profile" class="w-8 h-8 rounded-full border border-slate-200">
                <div class="text-left flex-1">
                    <div class="text-slate-900 font-semibold text-sm">Creator Workspace</div>
                    <div class="text-xs text-slate-500">Free Plan</div>
                </div>
                <i class="fa-solid fa-chevron-right text-xs"></i>
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col h-full relative overflow-hidden bg-slate-50/50">
        <header class="h-16 glass-panel border-b border-slate-200 flex items-center justify-between px-8 z-10 relative">
            <h2 class="text-lg font-semibold text-slate-800" id="current-view-title">Dashboard</h2>
            <div class="flex items-center gap-4">
                <button class="w-9 h-9 rounded-full bg-white border border-slate-200 flex items-center justify-center text-slate-500 hover:text-midnight-600 hover:shadow-md app-transition"><i class="fa-solid fa-bell"></i></button>
                <button class="px-4 py-2 bg-gradient-to-r from-midnight-600 to-indigo-600 text-white rounded-lg shadow-md shadow-midnight-500/20 text-sm font-medium hover:-translate-y-0.5 app-transition flex items-center gap-2">
                    <i class="fa-solid fa-plus"></i> New Project
                </button>
            </div>
        </header>
        <div id="view-container" class="flex-1 overflow-auto p-8 app-transition"></div>
    </main>

    <!-- Global Modal -->
    <div id="global-modal" class="hidden fixed inset-0 z-50 flex items-center justify-center">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="closeModal()"></div>
        <div id="modal-content" class="relative bg-white rounded-2xl shadow-2xl w-full max-w-lg overflow-hidden transform scale-95 opacity-0 app-transition"></div>
    </div>

    <!-- Modular JS (Defer ensures they load in order before DOMContentLoaded) -->
    <script src="js/firebase.js" defer></script>
    <script src="js/dashboard.js" defer></script>
    <script src="js/videos.js" defer></script>
    <script src="js/tasks.js" defer></script>
    <script src="js/brands.js" defer></script>
    <script src="js/calendar.js" defer></script>
    <script src="js/settings.js" defer></script>
    <script src="js/navigation.js" defer></script>
    <script src="js/app.js" defer></script>
</body>
</html>
